version: 2

models:
  - name: fct_departure_delays
    description: "Fact table for departure delays, dashboard + ML ready"
    columns:
      - name: departure_sk
        tests: [not_null, unique]
      - name: service_date
        tests: [not_null]
      - name: stop_id
        tests: [not_null]

  - name: mart_mobility_kpis_daily
    description: "Daily KPIs for overview page (cards)"
    columns:
      - name: service_date
        tests: [not_null, unique]
      - name: departures_total
        tests: [not_null]

  - name: mart_mobility_kpis_hourly
    description: "Hourly KPIs for trends + heatmaps"
    columns:
      - name: service_date
        tests: [not_null]
      - name: hour_of_day
        tests: [not_null]
      - name: transport_category
        tests: [not_null]
    -name: mart_stop_kpis_daily
    description: "Daily KPIs aggregated by stop + transport_category"
    columns:
      - name: service_date
        tests: [not_null]
      - name: stop_id
        tests: [not_null]
      - name: transport_category
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [service_date, stop_id, transport_category]

  - name: mart_route_kpis_daily
    description: "Daily KPIs aggregated by route + transport_category"
    columns:
      - name: service_date
        tests: [not_null]
      - name: route_key
        tests: [not_null]
      - name: transport_category
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [service_date, route_key, transport_category]
  


  - name: mart_timeseries_daily
    description: "Daily timeseries base for forecasting/anomaly"
    columns:
      - name: service_date
        tests: [not_null]
      - name: transport_category
        tests: [not_null]
